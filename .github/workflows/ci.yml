name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/autospace?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install dependencies
        run: npm install

      - name: Build workspaces
        run: npm run build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Deploy main to AutoSpace VPS
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::Missing one or more required secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/autospace_vps
          chmod 600 ~/.ssh/autospace_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/autospace_vps -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" <<'REMOTE'
            set -euo pipefail
            cd /var/www/autospace
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run db:deploy
            npm run build
            pm2 startOrRestart ecosystem.config.cjs --update-env
            pm2 save
            curl -fsS http://127.0.0.1:4015/api/health
            curl -fsSI http://127.0.0.1:3015 >/dev/null
          REMOTE
